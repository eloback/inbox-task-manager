[package]
name = "inbox-task-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # std File::lock
description = "An inbox for Herdr task sessions"
license = "MIT"
publish = false

# The binary must be named itm: the attach loop recognizes its own markers by
# the process name (DESIGN.md section 2).
[[bin]]
name = "itm"
path = "src/main.rs"

# Exact pins: every version was released at least two weeks before it was
# added; Cargo.lock pins the transitive ones. Why each one: DESIGN.md, section 4.
[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
jiff = "=0.2.38"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-textarea = { version = "=0.9.3", default-features = false, features = ["crossterm"] }
regex-lite = "=0.1.9"
rustix = { version = "=1.1.5", features = ["event", "net", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
shlex = "=2.0.1"
signal-hook = "=0.3.18"
tempfile = "=3.27.0"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
tui-input = { version = "=0.15.5", default-features = false, features = ["crossterm"] }
unicode-normalization = "=0.1.26"

[dev-dependencies]
insta = "=1.49.0"

# The switching protocol with real processes: the test binary also plays
# herdr (see its main), so it has its own harness.
[[test]]
name = "switching"
harness = false

[lints.rust]
unsafe_code = "deny"

# Not panic = "abort": the daemon catches a panicking pass and goes on.
[profile.release]
lto = true
codegen-units = 1
strip = true
