name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain the code is checked with (DESIGN.md section 6).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --quiet -- --help

  msrv:
    name: builds with the oldest Rust it claims (Cargo.toml rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --all-targets

  nix:
    name: nix build and flake check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Building runs the tests; the flake's checks add clippy and rustfmt.
      - run: nix build -L
      - run: nix flake check -L
