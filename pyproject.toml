[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-task-manager"
version = "0.2.0"
description = "Inbox-style task manager on top of Herdr named sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8"]
keywords = ["herdr", "terminal", "tasks", "tui", "agents"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
# The attach loop's command line must contain one of these names (DESIGN.md:
# is_itm_process), so keep them when adding entry points.
inbox-task-manager = "inbox_task_manager:main"
itm = "inbox_task_manager:main"

[tool.setuptools]
packages = ["inbox_task_manager"]
